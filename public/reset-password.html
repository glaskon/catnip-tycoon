<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Catnip Tycoon</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .reset-container {
      max-width: 420px;
      margin: 80px auto;
      padding: 24px;
      background: var(--bg-secondary);
      border-radius: var(--border-radius);
      border: 1px solid var(--bg-tertiary);
    }
    .reset-container h2 {
      text-align: center;
      color: var(--cat-orange);
      margin-bottom: 20px;
    }
    .reset-container input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: var(--bg-primary);
      border: 1px solid var(--bg-tertiary);
      border-radius: var(--border-radius);
      color: var(--text-primary);
    }
    .reset-container .btn {
      width: 100%;
      margin-top: 12px;
    }
    .reset-container .message {
      text-align: center;
      margin-top: 12px;
      font-size: 0.85rem;
    }
    .reset-container .error {
      color: var(--danger);
    }
    .reset-container .success {
      color: var(--success);
    }
    .reset-container a {
      color: var(--cat-orange);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="reset-container">
      <div style="text-align: center; font-size: 64px; margin-bottom: 8px;">🐱</div>
      <h2 id="resetTitle">Reset Password</h2>

      <!-- Step 1: Enter email -->
      <div id="step-email">
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 16px;">
          Enter your email address and we'll send you a reset link.
        </p>
        <input type="email" id="resetEmail" placeholder="Your email address" required>
        <button class="btn btn-primary" id="btnSendReset">Send Reset Link</button>
        <p id="resetEmailMessage" class="message"></p>
      </div>

      <!-- Step 2: Enter new password (shown when ?token= is present) -->
      <div id="step-password" style="display: none;">
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 16px;">
          Enter your new password.
        </p>
        <input type="password" id="newPassword" placeholder="New password (min 8 chars, 1 uppercase, 1 digit)" required>
        <input type="password" id="newPasswordConfirm" placeholder="Confirm new password" required>
        <button class="btn btn-primary" id="btnResetPassword">Reset Password</button>
        <p id="resetPasswordMessage" class="message"></p>
      </div>

      <p style="text-align: center; margin-top: 20px; font-size: 0.85rem;">
        <a href="/">← Back to game</a>
      </p>
    </div>
  </div>

  <script>
    // Parse token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    // Show appropriate step based on presence of token
    if (token) {
      document.getElementById('step-email').style.display = 'none';
      document.getElementById('step-password').style.display = 'block';
      document.getElementById('resetTitle').textContent = 'Set New Password';
    }

    // Step 1: Request reset link
    document.getElementById('btnSendReset').addEventListener('click', async () => {
      const email = document.getElementById('resetEmail').value.trim();
      const msg = document.getElementById('resetEmailMessage');

      if (!email) {
        msg.textContent = 'Please enter your email address.';
        msg.className = 'message error';
        return;
      }

      msg.textContent = 'Sending...';
      msg.className = 'message';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        msg.textContent = data.message || 'If this email is registered, a reset link has been sent.';
        msg.className = 'message success';
      } catch (err) {
        msg.textContent = 'Failed to send. Please try again later.';
        msg.className = 'message error';
      }
    });

    // Step 2: Reset password
    document.getElementById('btnResetPassword').addEventListener('click', async () => {
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('newPasswordConfirm').value;
      const msg = document.getElementById('resetPasswordMessage');

      if (!password || password.length < 8) {
        msg.textContent = 'Password must be at least 8 characters.';
        msg.className = 'message error';
        return;
      }
      if (!/[A-Z]/.test(password)) {
        msg.textContent = 'Password must contain at least one uppercase letter.';
        msg.className = 'message error';
        return;
      }
      if (!/[0-9]/.test(password)) {
        msg.textContent = 'Password must contain at least one digit.';
        msg.className = 'message error';
        return;
      }
      if (password !== confirm) {
        msg.textContent = 'Passwords do not match.';
        msg.className = 'message error';
        return;
      }

      msg.textContent = 'Resetting...';
      msg.className = 'message';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();

        if (data.success) {
          msg.textContent = '✅ ' + data.message;
          msg.className = 'message success';
          // Link back to game after 3 seconds
          setTimeout(() => { window.location.href = '/'; }, 3000);
        } else {
          msg.textContent = data.error || 'Reset failed.';
          msg.className = 'message error';
        }
      } catch (err) {
        msg.textContent = 'Failed to reset. Please try again.';
        msg.className = 'message error';
      }
    });
  </script>
</body>
</html>
